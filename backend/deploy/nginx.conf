# Nginx server block for the London Property Hub API.
#
# Assumes certificates from certbot. Run:
#   sudo certbot --nginx -d api.londonhotelgroup.co.uk
# before enabling the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name api.londonhotelgroup.co.uk;

    # Everything is HTTPS. iOS App Transport Security requires it, and the app
    # ships with no exception for this domain.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.londonhotelgroup.co.uk;

    root /home/forge/api.londonhotelgroup.co.uk/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.londonhotelgroup.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.londonhotelgroup.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    # Document uploads can be large; exports can take a moment to generate.
    client_max_body_size 24M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Report generation over a large portfolio can outrun the default.
        fastcgi_read_timeout 120;
    }

    # Never serve anything from these, whatever the request path claims.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(storage/app|bootstrap/cache|vendor)/ {
        deny all;
    }

    access_log /var/log/nginx/property-hub-access.log;
    error_log  /var/log/nginx/property-hub-error.log error;
}
